services:
  - type: web
    name: offline-notes-app
    runtime: node
    buildCommand: npm install --include=dev && cd client && npm install --include=dev && cd .. && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/app.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
